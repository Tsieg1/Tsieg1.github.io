<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite colors</title>

    

    <style>
        *{
            /*css hex codes*/
            --green:(#339933);
            --red:(#800000);
            --blue:(#0033cc);
            --offwhite:(#e5e5cd);
        }
        
        @media only screen and (max-width: 600px) {
            body {
                background-color: #0033cc;

                display: grid;
                grid-template-columns: 100%;
            }
        }

        .body {
            display: grid;
            background-color: black;
            grid-template-columns: 50% 50%;
            grid-template-rows: 50% 50%; 
            gap: 12px;
        }

        


        nav {
            position:fixed;
            top: 0px;
            left: 0px;
            background-color: black;
            color: white;
            display:flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            margin: 0 auto;
            width: 100vw;
            z-index: 10;
            height: 50px;
            
        }

        nav > ul {
            margin-left: 20px;

            flex-grow: auto;
            list-style-type: none;
            display: flex;
            justify-content: space-around;
        }

        nav > ul > li {
            padding: 12px;
            margin-right: 12px;
        }

        
        
        
        h1 {
            padding-top: 50px;
        }
        
        
        #one {
        background-color: antiquewhite;
        width: 75vw;
        display: grid;
        grid-template-rows: 50% 50%;
        width: 300px;
        height: 250px;
        padding: 36px;
        border-radius: 12px;
        border-color: red;
        margin-bottom: 12px;
        color: #800000;
        
        }

        #one > img {
            object-fit:fill;
            width: 100%;
            height:100px;
        }

        

        #two {
        background-color:antiquewhite;
        width: 75vw;
        display: grid;
        grid-template-rows: 50% 50%;
        width: 300px;
        height: 250px;
        padding: 36px;
        border-radius: 12px;
        border-color: #339933;
        margin-bottom: 12px;
        color: #339933;
        
        }

        #two > img {
            object-fit:fill;
            width: 100%;
            height:100px;
        }

        #three {
        background-color: antiquewhite;
        width: 75vw;
        display: grid;
        grid-template-rows: 50% 50%;
        width: 300px;
        height: 250px;
        padding: 36px;
        border-radius: 12px;
        border-color: red;
        margin-bottom: 12px;
        color: #0033cc;

        }

        #three > img {
            object-fit:fill;
            width: 100%;
            height:100px;
        }
        
        

        
        
    </style>
</head>

<body>
    
       
    <nav>
        <ul>
            <li>Home</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
        </ul>
    </nav>
    

    
    <h1>-Colors I enjoy</h1>

    <div class="cards">
        <div id="one">
        <img src="assets\red.png"/>
        <P>Maroon #800000</P>
        </div>
        <div id="two">
        <img src="assets\green.png"/>
        <P>Green #339933</P>
        </div>
        <div id="three">
        <img src="assets\blue.png"/>
        <P>Blue #0033cc</P>
        
        </div>
    </div>
</body>

</html>
